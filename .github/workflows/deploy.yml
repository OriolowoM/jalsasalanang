name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # =================================================================
  # Step 1: Cloud Build & Validation (16GB Runner)
  # =================================================================
  build:
    name: Build & Package Production Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Shared Package
        run: |
          npx tsc -p packages/shared/tsconfig.json

      - name: Generate Prisma Client & Linux Engines
        env:
          DATABASE_URL: 'mysql://ahmabumi_jalsauser:dummy_password@localhost:3306/ahmabumi_jalsa'
        run: |
          npx prisma generate

      - name: Build Express API Backend
        run: |
          npm run build:api

      - name: Build Next.js Production Web
        env:
          NEXT_PUBLIC_SITE_URL: 'https://jalsasalana.ng'
          DATABASE_URL: 'mysql://ahmabumi_jalsauser:dummy_password@localhost:3306/ahmabumi_jalsa'
          JWT_SECRET: 'build_time_jwt_secret_jalsa_2026'
          NODE_ENV: 'production'
        run: |
          npm run build:web

      - name: Archive Production Package
        run: |
          tar --exclude='apps/web/.next/cache' \
              --exclude='*.dll.node' \
              --exclude='*openssl-1.1.x*' \
              --exclude='*openssl-3.0.x*' \
              -czf deploy.tar.gz \
              server.js \
              package.json \
              prisma \
              apps/api/dist \
              apps/web/.next \
              apps/web/public \
              apps/web/app \
              apps/web/components \
              apps/web/lib \
              packages/shared

      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-deploy-bundle
          path: deploy.tar.gz
          retention-days: 3

  # =================================================================
  # Step 2: Human Approval Gate & Production Deploy
  # =================================================================
  deploy:
    name: Deploy to cPanel (jalsasalana.ng)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://jalsasalana.ng

    steps:
      - name: Download Deployment Artifact
        uses: actions/download-artifact@v4
        with:
          name: cpanel-deploy-bundle

      - name: Setup SSH Key & Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          SSH_PORT="${{ secrets.CPANEL_SSH_PORT || '21098' }}"
          SSH_HOST="${{ secrets.CPANEL_SSH_HOST }}"
          ssh-keyscan -p $SSH_PORT $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Execute Atomic cPanel Deployment
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '21098' }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          APP_DIR: ${{ secrets.CPANEL_APP_DIR || '/home/ahmabumi/jalsasalana.ng' }}
        run: |
          echo "Connecting to $SSH_HOST on port $SSH_PORT..."

          # 1. Transfer the compiled archive to cPanel via secure SCP
          echo "Uploading production deploy bundle..."
          scp -o StrictHostKeyChecking=no -P $SSH_PORT deploy.tar.gz $SSH_USER@$SSH_HOST:$APP_DIR/deploy.tar.gz

          # 2. Touch and upload restart.txt to trigger Passenger zero-downtime reload & self-extraction
          echo "Triggering zero-downtime application reload..."
          touch restart.txt
          scp -o StrictHostKeyChecking=no -P $SSH_PORT restart.txt $SSH_USER@$SSH_HOST:$APP_DIR/tmp/restart.txt
          echo "Deploy bundle and restart trigger successfully delivered via SCP."

      - name: Automated Production Health Check
        run: |
          echo "Waiting 6 seconds for Passenger process reload and archive extraction..."
          sleep 6
          echo "Checking site and database availability at https://jalsasalana.ng..."
          
          # Retry up to 6 times for Passenger to complete warmup and extraction
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://jalsasalana.ng/ || echo "000")
            API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://jalsasalana.ng/api/v1/articles || echo "000")
            echo "Attempt $i: Web Status $STATUS, API Articles Status $API_STATUS"
            if [ "$STATUS" = "200" ] && [ "$API_STATUS" = "200" ]; then
              echo "Health check passed successfully! All web & API endpoints live."
              exit 0
            fi
            sleep 4
          done

          echo "Warning: Health check failed. Web: $STATUS, API: $API_STATUS."
          exit 1

      - name: Automatic Rollback on Failure
        if: failure()
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '21098' }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          APP_DIR: ${{ secrets.CPANEL_APP_DIR || '/home/ahmabumi/jalsasalana.ng' }}
        run: |
          echo "Deployment failed health check! Touch restart to attempt worker recovery..."
          touch restart.txt
          scp -o StrictHostKeyChecking=no -P $SSH_PORT restart.txt $SSH_USER@$SSH_HOST:$APP_DIR/tmp/restart.txt || true
