name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # =================================================================
  # Step 1: Cloud Build & Validation (16GB Runner)
  # =================================================================
  build:
    name: Build & Package Production Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Generate Prisma Client & Linux Engines
        run: |
          npx prisma generate

      - name: Build Express API Backend
        run: |
          npm run build:api

      - name: Build Next.js Production Web
        env:
          NEXT_PUBLIC_SITE_URL: 'https://jalsasalana.ng'
          NODE_ENV: 'production'
        run: |
          npm run build:web

      - name: Archive Production Package
        run: |
          tar --exclude='apps/web/.next/cache' \
              -czf deploy.tar.gz \
              server.js \
              package.json \
              prisma \
              apps/api/dist \
              apps/web/.next \
              apps/web/public \
              apps/web/app \
              apps/web/components \
              apps/web/lib \
              packages/shared/dist

      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-deploy-bundle
          path: deploy.tar.gz
          retention-days: 3

  # =================================================================
  # Step 2: Human Approval Gate & Production Deploy
  # =================================================================
  deploy:
    name: Deploy to cPanel (jalsasalana.ng)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://jalsasalana.ng

    steps:
      - name: Download Deployment Artifact
        uses: actions/download-artifact@v4
        with:
          name: cpanel-deploy-bundle

      - name: Setup SSH Key & Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          SSH_PORT="${{ secrets.CPANEL_SSH_PORT || '21098' }}"
          SSH_HOST="${{ secrets.CPANEL_SSH_HOST }}"
          ssh-keyscan -p $SSH_PORT $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Execute Atomic cPanel Deployment
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '21098' }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          APP_DIR: ${{ secrets.CPANEL_APP_DIR || '/home/ahmabumi/jalsasalana.ng' }}
        run: |
          echo "Connecting to $SSH_HOST on port $SSH_PORT..."

          # 1. Create remote snapshot backup on server before modifying files
          ssh -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SSH_HOST << EOF
            set -e
            mkdir -p ~/deploy_backups
            TIMESTAMP=\$(date +%Y%m%d_%H%M%S)
            echo "Creating safety backup snapshot at ~/deploy_backups/backup_\$TIMESTAMP..."
            if [ -d "$APP_DIR" ]; then
              rsync -a --exclude='node_modules' --exclude='.next/cache' $APP_DIR/ ~/deploy_backups/backup_latest/
            fi
          EOF

          # 2. Transfer the compiled archive to cPanel
          echo "Uploading deploy bundle..."
          scp -o StrictHostKeyChecking=no -P $SSH_PORT deploy.tar.gz $SSH_USER@$SSH_HOST:$APP_DIR/deploy.tar.gz

          # 3. Extract in place, cleanup, and trigger zero-downtime reload
          ssh -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SSH_HOST << EOF
            set -e
            cd $APP_DIR
            echo "Extracting production build..."
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            # Clean any stale /tmp prisma engines if present
            rm -f /tmp/prisma-engines/libquery_engine* 2>/dev/null || true

            # Touch restart.txt to trigger Passenger application reload
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Application reload triggered via tmp/restart.txt"
          EOF

      - name: Automated Production Health Check
        run: |
          echo "Waiting 5 seconds for application to reload..."
          sleep 5
          echo "Checking site availability at https://jalsasalana.ng..."
          
          # Retry up to 5 times for Passenger to complete warmup
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://jalsasalana.ng/ || echo "000")
            echo "Attempt $i: HTTP Status $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "Health check passed successfully with HTTP $STATUS!"
              exit 0
            fi
            sleep 4
          done

          echo "Warning: Site responded with status $STATUS. Checking logs..."
          exit 1

      - name: Automatic Rollback on Failure
        if: failure()
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '21098' }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          APP_DIR: ${{ secrets.CPANEL_APP_DIR || '/home/ahmabumi/jalsasalana.ng' }}
        run: |
          echo "Deployment failed health check! Initiating automatic rollback..."
          ssh -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SSH_HOST << EOF
            if [ -d ~/deploy_backups/backup_latest ]; then
              echo "Restoring previous working version from ~/deploy_backups/backup_latest..."
              rsync -a --exclude='node_modules' ~/deploy_backups/backup_latest/ $APP_DIR/
              mkdir -p $APP_DIR/tmp
              touch $APP_DIR/tmp/restart.txt
              echo "Rollback completed. Previous working version restored."
            fi
          EOF
